defaults:
  - al: dtd47
  - classifier: geo_reg_f
  - paths: default
  - dataset: dtd47
  - embedder@classification_embedder: dinov2
  - embedder@simulation_embedder: clip
  - pipeline: default
  - simulation: dtd47
  - module: mlp
  - training: default
  - calibration: disabled
  - scheduler: step_ratio_1
  - sample@sample.init: random
  - sample@sample.actual: random
  - scorer@scorer.init: random
  - scorer@scorer.actual: ks_bag_full_confusion_channel_prior
  - assigner@assigner.init: quota_sample
  - assigner@assigner.actual: greedy_sample
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_
experiment_name: "test"
results_path: ${paths.results_path}
mlflow_write_jitter_max_seconds: 60.0
device: "cpu"
missing_label: -1
exit_after_simulation: False
seed: 19
hydra:
  run:
    dir: .
  output_subdir: null
