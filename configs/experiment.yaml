defaults:
  - al: trec6
  - classifier: annot_mix_gating
  - paths: default
  - dataset: trec6
  - embedder@classification_embedder: mpnetv2
  - embedder@simulation_embedder: minilmv2
  - pipeline: default
  - simulation: trec6
  - module: mlp
  - training: default 
  - scheduler: step_ratio_1
  - sample@sample.init: random
  - sample@sample.actual: random
  - scorer@scorer.init: random
  - scorer@scorer.actual: blga_gated_mean
  - assigner@assigner.init: quota_sample
  - assigner@assigner.actual: greedy_sample_loose_cap
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_
experiment_name: "test"
results_path: ${paths.results_path}
mlflow_write_jitter_max_seconds: 60.0
device: "cuda"
missing_label: -1
exit_after_simulation: false
seed: 5
utility_tsne:
  enabled: false
  cycles: [0, 5, 10, 15, 20]
  annotator_indices: [13, 11]
  max_background_points: 2000
  perplexity: 30
  random_state: ${seed}
  output_dir: figures/utility_tsne
  file_format: png
  dpi: 160
annotator_behavior_tsne:
  enabled: false
  annotator_indices: [] # [] means all annotators
  max_points: 1000
  stratify_by_true_class: true
  feature_preprocess: auto
  perplexity: 30
  random_state: ${seed}
  output_dir: figures/annotator_behavior_tsne
  file_format: png
  dpi: 160
hydra:
  run:
    dir: .
  output_subdir: null
