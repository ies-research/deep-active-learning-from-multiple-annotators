defaults:
  - profile@_here_: dtd47_expert_novice_mix
  - regime: local
  - _self_

_target_: src.dataset.MultiAnnotatorSimConfig

seed: 17
n_annotators: 40
allocation: deterministic
missing_rate: 0.0
missing_value: -1

feature_preprocess: l2_normalize

use_difficulty: true
