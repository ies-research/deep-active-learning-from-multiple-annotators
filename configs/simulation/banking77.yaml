defaults:
  - profile@_here_: medium
  - regime: local
  - _self_

_target_: src.dataset.MultiAnnotatorSimConfig

seed: 1
n_annotators: 30
allocation: deterministic
missing_rate: 0.0
missing_value: -1

feature_preprocess: l2_normalize

use_difficulty: true
difficulty_k: 15
difficulty_metric: entropy
difficulty_alpha: 1.0

# z_train caching (independent of embedder)
cache_dir: ${paths.multi_annotator_cache_dir}
cache_version: 1
cache_store_metadata: true
