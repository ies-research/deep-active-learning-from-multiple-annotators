defaults:
  - profile@_here_: dtd47_high_difficulty_specialist
  - regime: local
  - _self_

_target_: src.dataset.MultiAnnotatorSimConfig

seed: 29
n_annotators: 40
allocation: deterministic
missing_rate: 0.0
missing_value: -1

feature_preprocess: l2_normalize

use_difficulty: true
difficulty_k: 21
difficulty_metric: entropy
difficulty_alpha: 1.35

cache_dir: ${paths.multi_annotator_cache_dir}
cache_version: 1
cache_store_metadata: true
