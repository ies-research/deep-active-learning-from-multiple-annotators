_target_: src.scorer.KernelSmoothedBayesianAnnotatorGain

# Accuracy prior
accuracy_mean: per_annotator_observed # to be investigated
accuracy_strength: 1.0 # to be investigated

# Correctness mode
correctness_mode: "classifier"
observed_class_prior: "classifier" # classifier or kernel
observed_class_prior_leave_one_out: false

# Sample / annotator kernels
gamma_x: "median" # to be investigated
gamma_x_scope: "global" # to be investigated
gamma_a: "median"
use_annotator_embeddings: false
annotator_lambda: 1.0 # 0=local only, 1=global only

# Channel model
channel_variant: "full_confusion"
full_confusion_prior_source: "channel"
full_confusion_prior_strength: 3.0 # to be investigated
full_confusion_channel_prior_strength: 1.0 # deprecated alias
channel_label_dirichlet_strength: 1.0 # to be investigated
channel_wrong_label_mode: "normalize" # to be investigated
observed_evidence_weighting: "certainty" # none or certainty
observed_evidence_weight_floor: 0.05 # to be investigated

# Latent class prior
class_prior: "classifier" # to be investigated
class_prior_strength: 1.0 # to be investigated
class_prior_lambda: 0.0 # 0=local only, 1=global only
use_ess_class_prior: false
tau_class_prior: 1.0
sample_class_prior: false # to be investigated

# Posterior concentration / sampling
use_ess_beta: false
tau_beta: 1.0
use_ess_label_dirichlet: false
tau_label_dirichlet: 1.0 # to be investigated
n_mc_samples: 1
gain_ucb_quantile: null # use empirical gain posterior quantile over MC draws
sample_label_dirichlet: false # to be investigated
store_utility_draws: true
gain_batch_size: 128

# Approximation / utility
top_m: null
gain_type: entropy # to be investigated
random_state: ${seed}
